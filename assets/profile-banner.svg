<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">HexForge</title>
  <desc id="description">Unreal Engine editor tools and native game engine experiments.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.55" stop-color="#151322"/>
      <stop offset="1" stop-color="#231842"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#4dd4c6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <ellipse cx="600" cy="120" rx="420" ry="240" fill="url(#glow)"/>

  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.32">
    <path d="M72 74l34-20 34 20v40l-34 20-34-20z"/>
    <path d="M1060 186l34-20 34 20v40l-34 20-34-20z"/>
    <path d="M111 40v-18M102 31h18M1080 260v18M1071 269h18"/>
  </g>

  <g transform="translate(600 65)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round">
    <path d="M0-24 21-12v24L0 24-21 12v-24z"/>
    <path d="M-8-10v20M8-10v20M-8 0H8" stroke-linecap="round"/>
  </g>

  <text x="600" y="157" fill="#f5f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="13" text-anchor="middle">HEXFORGE</text>
  <rect x="465" y="181" width="270" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="600" y="218" fill="#c4bed8" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="3" text-anchor="middle">UNREAL ENGINE TOOLS · NATIVE C++ · ENGINE DEVELOPMENT</text>

  <g fill="#8b7cf6" opacity="0.65">
    <circle cx="48" cy="150" r="3"/>
    <circle cx="1152" cy="150" r="3"/>
  </g>
</svg>
